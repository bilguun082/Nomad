<html lang="mn">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark">
<title>Menu — Nomad Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0A0A0A;--surface:#141414;--text:#F4F1EA;--muted:#9C9992;--line:#262626;--accent:#D8A94B;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--surface:#141414}}
:root[data-theme="dark"]{--bg:#0A0A0A;--surface:#141414}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-decoration:none}
.brand svg{width:26px;height:26px}
.nav{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.nav b{color:var(--text);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:3px}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:26px;padding:14px 18px 0}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 15px Inter,system-ui,sans-serif;letter-spacing:.16em;padding:6px 0 10px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.subs{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:999px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;text-transform:lowercase}
.sub[aria-pressed="true"]{background:var(--accent);color:#0A0A0A;border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:6px 18px 40px}
.note{margin:14px 0 4px;color:var(--muted);font-size:14px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item img.ph{width:96px;height:96px;border-radius:12px;display:block;border:1px solid var(--line)}
.item svg{width:96px;height:96px;border-radius:12px;display:block;border:1px solid var(--line)}
.item h3{margin:0;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.spec{margin-top:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.price{font-weight:600;font-size:17px;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:1px 6px;margin-left:8px;vertical-align:middle}
footer{max-width:760px;margin:0 auto;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;padding:18px 18px 34px;border-top:1px solid var(--line)}
@media (max-width:440px){.item{grid-template-columns:80px 1fr auto;gap:12px}.item svg,.item img.ph{width:80px;height:80px}.tabs{gap:20px}}
</style>
</head>

var $=function(i){return document.getElementById(i)};
var T=MENU[0].id,U=MENU[0].subs[0].id;
function fmt(n){return n.toLocaleString("en-US")+"₮"}
function curTab(){return MENU.filter(function(m){return m.id===T})[0]}
function render(){
$("tabs").innerHTML=MENU.map(function(m){return '<button class="tab" aria-pressed="'+(m.id===T)+'" data-t="'+m.id+'">'+m.name+'</button>'}).join("");
var t=curTab();
$("subs").innerHTML=t.subs.map(function(s){return '<button class="sub" aria-pressed="'+(s.id===U)+'" data-s="'+s.id+'">'+s.name+'</button>'}).join("");
var s=t.subs.filter(function(x){return x.id===U})[0]||t.subs[0];
var h=s.note?'<p class="note">'+s.note+'</p>':'';
s.items.forEach(function(i){h+='<div class="item">'+im(i[5])+'<div><h3>'+i[0]+(i[4]?'<span class="tag">'+i[4]+'</span>':'')+'</h3>'+(i[1]?'<div class="spec">'+i[1]+'</div>':'')+'<p>'+i[2]+'</p></div><div class="price">'+fmt(i[3])+'</div></div>'});
$("list").innerHTML=h}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;T=b.getAttribute("data-t");U=curTab().subs[0].id;render();window.scrollTo({top:0})});
$("subs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;U=b.getAttribute("data-s");render();window.scrollTo({top:0})});
render();
</script>
